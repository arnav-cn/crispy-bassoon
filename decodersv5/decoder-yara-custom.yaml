# PORTED FROM WAZUH 4.9.2 - generated by port-decoders.py
# product/integration : yara-custom
# 4.x decoders merged : yara
#
# The <order> names of each 4.x decoder became the named groups of the
# rewritten regex, so the extraction is mechanical. The WCS target of
# each field is from 4x-to-wcs-map.json / decoder-field-map.json; a
# field with no target rides in `labels` (labels.* is not allowed).

name: decoder/yara-custom/0
parents:
  - decoder/core-wazuh-message/0
metadata:
  title: yara-custom decoder (ported from 4.9.2)
  description: >-
    Port of the 4.9.2 yara-custom decoders to the 5.0 Engine format.
    The 4.x decoded_as routing becomes event.dataset.
  author: CHANGE Networks
  date: '2026-10-22'
  modified: '2026-10-22'
  documentation: ''
  references: []
  supports: []
  version: '0.1.0'
check: 'starts_with($event.original, "wazuh-yara:info:")'
parse|event.original:
  - 'info: (?P<_tmp.yara_info>[^ ]+) [[](?P<_tmp.yara_metadata>.+)[]] (?P<_tmp.file>.+)'
    # escape \S rewritten
    # escape \. rewritten
    # escape \. rewritten
normalize:
  # 4.x routing yara <- 1 decoder(s), 4 rule(s) depend on it
  - check: 'starts_with($event.original, "wazuh-yara:info:")'
    map:
      - 'event.dataset': 'yara'
      - 'event.kind': 'event'
      - 'event.category': 'array_append_unique(host)'
      - 'file.path': '_tmp.file'
      # no WCS home, so they ride in ONE labels object:
      #   yara_info, yara_metadata
      # capture them with parse_key_value into $_tmp.kv first
      - 'labels': '$_tmp.kv'
enabled: true
