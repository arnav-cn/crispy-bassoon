# PORTED FROM WAZUH 4.9.2 - generated by port-decoders.py
# product/integration : wazuh-generic-1
# 4.x decoders merged : siem-authd, siem-authd-duplicate
#
# The <order> names of each 4.x decoder became the named groups of the
# rewritten regex, so the extraction is mechanical. The WCS target of
# each field is from 4x-to-wcs-map.json / decoder-field-map.json; a
# field with no target rides in `labels` (labels.* is not allowed).

name: decoder/siem-generic-1/0
parents:
  - decoder/core-wazuh-message/0
metadata:
  title: wazuh-generic-1 decoder (ported from 4.9.2)
  description: >-
    Port of the 4.9.2 wazuh-generic-1 decoders to the 5.0 Engine format.
    The 4.x decoded_as routing becomes event.dataset.
  author: CHANGE Networks
  date: '2026-10-22'
  modified: '2026-10-22'
  documentation: ''
  references: []
  supports: []
  version: '0.1.0'
check: 'starts_with($event.original, "siem-authd:")'
parse|event.original:
  - 'WARNING: Duplicate name ''(?P<_tmp.duplicate_name>[^ ]+)'', rejecting enrollment. Agent ''(?P<_tmp.agent_id>[0-9]+)'' key already exists on the manager.'
    # escape \S rewritten
    # escape \. rewritten
    # escape \d rewritten
    # escape \. rewritten
normalize:
  # 4.x routing siem-authd <- 2 decoder(s), 0 rule(s) depend on it
  - check: 'starts_with($event.original, "siem-authd:")'
    map:
      - 'event.dataset': 'siem-authd'
      - 'event.kind': 'event'
      - 'event.category': 'array_append_unique(host)'
      # no WCS home, so they ride in ONE labels object:
      #   duplicate_name, agent_id
      # capture them with parse_key_value into $_tmp.kv first
      - 'labels': '$_tmp.kv'
enabled: true
