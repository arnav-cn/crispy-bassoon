# PORTED FROM WAZUH 4.9.2 - generated by port-decoders.py
# product/integration : naxsi-opnsense-custom
# 4.x decoders merged : naxsi-opnsense-parent, naxsi-opnsense-child
#
# The <order> names of each 4.x decoder became the named groups of the
# rewritten regex, so the extraction is mechanical. The WCS target of
# each field is from 4x-to-wcs-map.json / decoder-field-map.json; a
# field with no target rides in `labels` (labels.* is not allowed).

name: decoder/naxsi-opnsense-custom/0
parents:
  - decoder/core-wazuh-message/0
metadata:
  title: naxsi-opnsense-custom decoder (ported from 4.9.2)
  description: >-
    Port of the 4.9.2 naxsi-opnsense-custom decoders to the 5.0 Engine format.
    The 4.x decoded_as routing becomes event.dataset.
  author: CHANGE Networks
  date: '2026-10-22'
  modified: '2026-10-22'
  documentation: ''
  references: []
  supports: []
  version: '0.1.0'
check: 'starts_with($event.original, "Cloudfence-WAF")'
parse|event.original:
  - 'ip=(?P<_tmp.srcip>[^ ]+).server=(?P<_tmp.server>[^ ]+).uri=(?P<_tmp.uri>[^ ]+).vers=(?P<_tmp.naxsi_version>[^ ]+).total_processed=(?P<_tmp.processed_requests>[0-9]+).total_blocked=(?P<_tmp.blocked_requests>[0-9]+).config=(?P<_tmp.mode>[A-Za-z0-9_]+).'
    # escape \S rewritten
    # escape \p rewritten
    # escape \S rewritten
    # escape \p rewritten
    # escape \S rewritten
    # escape \p rewritten
    # escape \S rewritten
    # escape \p rewritten
    # escape \d rewritten
    # escape \p rewritten
    # escape \d rewritten
    # escape \p rewritten
    # escape \w rewritten
    # escape \p rewritten
  - 'cscore[0-9]=(?P<_tmp.score_tag>[0-9]+).'
    # escape \d rewritten
    # escape \d rewritten
    # escape \p rewritten
  - 'score[0-9]=(?P<_tmp.score>[0-9]+).'
    # escape \d rewritten
    # escape \d rewritten
    # escape \p rewritten
  - 'zone[0-9]=(?P<_tmp.zone>[^ ]+).'
    # escape \d rewritten
    # escape \S rewritten
    # escape \p rewritten
  - 'id[0-9]=(?P<_tmp.rule_id>[0-9]+).'
    # escape \d rewritten
    # escape \d rewritten
    # escape \p rewritten
  - 'request: \"(?P<_tmp.request>.+)\"'
    # escape \. rewritten
  - 'referrer: \"(?P<_tmp.referrer>.+)\"'
    # escape \. rewritten
normalize:
  # 4.x routing naxsi-opnsense-parent <- 2 decoder(s), 3 rule(s) depend on it
  - check: 'starts_with($event.original, "Cloudfence-WAF")'
    map:
      - 'event.dataset': 'naxsi-opnsense-parent'
      - 'event.kind': 'event'
      - 'event.category': 'array_append_unique(host)'
      - 'source.ip': '_tmp.srcip'
      - 'server.address': '_tmp.server'
      - 'url.original': '_tmp.uri'
      - 'url.original': '_tmp.request'
      - 'http.request.referrer': '_tmp.referrer'
      # no WCS home, so they ride in ONE labels object:
      #   naxsi_version, processed_requests, blocked_requests, mode, score_tag, score, zone, rule_id
      # capture them with parse_key_value into $_tmp.kv first
      - 'labels': '$_tmp.kv'
enabled: true
