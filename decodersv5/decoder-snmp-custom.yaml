normalize:
  # 4.x routing oid_snmp_decoder <- 3 decoder(s), 0 rule(s) depend on it
  - check: 'starts_with($event.original, "SNMPTRAP:host=")'
    map:
      - 'event.dataset': 'oid_snmp_decoder'
      - 'event.kind': 'event'
      - 'event.category': 'array_append_unique(host)'
      - '_tmp.oid_snmp_decoder_matched': '1'
      - 'user.name': '_tmp.srcuser'
      # no WCS home, so they ride in ONE labels object:
      #   location, engine_id, oid
      # capture them with parse_key_value into $_tmp.kv first
      - 'labels': '$_tmp.kv'
  # 4.x routing snmptrap <- 8 decoder(s), 0 rule(s) depend on it
  # the marker of a more specific branch of this product also matches - this branch is the generic one
  - check: 'starts_with($event.original, "SNMPTRAP:") AND not_exists(_tmp.oid_snmp_decoder_matched)'
    map:
      - 'event.dataset': 'snmptrap'
      - 'event.kind': 'event'
      - 'event.category': 'array_append_unique(host)'
      - 'source.ip': '_tmp.srcip'
      - 'user.name': '_tmp.snmp_user'
      - 'destination.ip': '_tmp.device_ip'
      - 'event.action': '_tmp.login_type'
      - 'event.outcome': '_tmp.login_result'
      - 'user.name': '_tmp.login_user'
      # no WCS home, so they ride in ONE labels object:
      #   engine_id, snmp_version, trap_oid, session_type
      # capture them with parse_key_value into $_tmp.kv first
      - 'labels': '$_tmp.kv'
enabled: true
