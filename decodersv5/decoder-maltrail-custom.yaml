# PORTED FROM WAZUH 4.9.2 - generated by port-decoders.py
# product/integration : maltrail-custom
# 4.x decoders merged : CEF
#
# The <order> names of each 4.x decoder became the named groups of the
# rewritten regex, so the extraction is mechanical. The WCS target of
# each field is from 4x-to-wcs-map.json / decoder-field-map.json; a
# field with no target rides in `labels` (labels.* is not allowed).

name: decoder/maltrail-custom/0
parents:
  - decoder/core-wazuh-message/0
metadata:
  title: maltrail-custom decoder (ported from 4.9.2)
  description: >-
    Port of the 4.9.2 maltrail-custom decoders to the 5.0 Engine format.
    The 4.x decoded_as routing becomes event.dataset.
  author: CHANGE Networks
  date: '2026-10-22'
  modified: '2026-10-22'
  documentation: ''
  references: []
  supports: []
  version: '0.1.0'
check: 'contains($event.original, "CEF:")'
parse|event.original:
  - '(?P<_tmp.code>[A-Za-z0-9_]+)[|](?P<_tmp.application>[A-Za-z0-9_]+)[|](?P<_tmp.type>[A-Za-z0-9_]+)[|](?P<_tmp.version>[^|]+)[|](?P<_tmp.date>[0-9]+-[0-9]+-[0-9]+)[|](?P<_tmp.category>[^|]+)[|](?P<_tmp.severity>[0-9]+)[|]src=(?P<_tmp.srcip>[0-9]+.[0-9]+.[0-9]+.[0-9]+) spt=(?P<_tmp.srcport>[^ ]+) dst=(?P<_tmp.dstip>[0-9]+.[0-9]+.[0-9]+.[0-9]+) dpt=(?P<_tmp.dstport>[^ ]+) trail=(?P<_tmp.trail>[^ ]+) ref=(?P<_tmp.ref>[^ ]+)'
    # escape \w rewritten
    # escape \| rewritten
    # escape \w rewritten
    # escape \| rewritten
    # escape \w rewritten
    # escape \| rewritten
    # escape \| rewritten
    # escape \d rewritten
    # escape \d rewritten
    # escape \d rewritten
    # escape \| rewritten
    # escape \| rewritten
    # escape \d rewritten
    # escape \| rewritten
    # escape \d rewritten
    # escape \. rewritten
    # escape \d rewritten
    # escape \. rewritten
    # escape \d rewritten
    # escape \. rewritten
    # escape \d rewritten
    # escape \d rewritten
    # escape \. rewritten
    # escape \d rewritten
    # escape \. rewritten
    # escape \d rewritten
    # escape \. rewritten
    # escape \d rewritten
normalize:
  # 4.x routing CEF <- 1 decoder(s), 4 rule(s) depend on it
  - check: 'contains($event.original, "CEF:")'
    map:
      - 'event.dataset': 'CEF'
      - 'event.kind': 'event'
      - 'event.category': 'array_append_unique(host)'
      - 'event.code': '_tmp.code'
      - 'service.name': '_tmp.application'
      - 'event.action': '_tmp.type'
      - 'event.category': '_tmp.category'
      # event.severity is WCS type long/integer -> cast from parsed string
      - 'event.severity': 'to_int(_tmp.severity)'
      - 'source.ip': '_tmp.srcip'
      # source.port is WCS type long/integer -> cast from parsed string
      - 'source.port': 'to_int(_tmp.srcport)'
      - 'destination.ip': '_tmp.dstip'
      # destination.port is WCS type long/integer -> cast from parsed string
      - 'destination.port': 'to_int(_tmp.dstport)'
      # no WCS home, so they ride in ONE labels object:
      #   version, date, trail, ref
      # capture them with parse_key_value into $_tmp.kv first
      - 'labels': '$_tmp.kv'
enabled: true
