# PORTED FROM WAZUH 4.9.2 - generated by port-decoders.py
# product/integration : windows-rules-custom
# 4.x decoders merged : sysmon-linux, sysmon-linux-child

name: decoder/windows-rules-custom/0
parents:
  - decoder/core-wazuh-message/0
metadata:
  title: windows-rules-custom decoder (ported from 4.9.2)
  description: >-
    Port of the 4.9.2 windows-rules-custom decoders to the 5.0 Engine format.
    The 4.x decoded_as routing becomes event.dataset.
  author: CHANGE Networks
  date: '2026-10-22'
  modified: '2026-10-22'
  documentation: ''
  references: []
  supports: []
  version: '0.1.0'
check: 'contains($event.original, "EventID")'
normalize:
  - check: 'contains($event.original, "EventID")'
    map:
      - 'event.code': 'regex_extract($event.original, ''EventID>([0-9]+)')'
      - 'event.type': 'regex_extract($event.original, ''Channel>([^/]+)')'
      - 'event.severity': 'to_int(regex_extract($event.original, ''Level>([0-9]+)'))'
      - 'event.action': 'regex_extract($event.original, ''Opcode>([0-9]+)')'
      - 'event.created': 'regex_extract($event.original, ''SystemTime>([0-9]+-[0-9]+-[0-9]+T[0-9]+:[0-9]+:[0-9]+[.][0-9]+[A-Za-z0-9_]+)')'
      - 'process.executable': 'regex_extract($event.original, ''Data Name="Image">([^/]+)')'
      - 'process.command_line': 'regex_extract($event.original, ''Data Name="CommandLine">([^/]+)')'
      - 'process.parent.executable': 'regex_extract($event.original, ''Data Name="ParentImage">([^/]+)')'
      - 'user.name': 'regex_extract($event.original, ''Data Name="User">([^/]+)')'
      - 'host.name': 'regex_extract($event.original, ''Computer>([^/]+)')'
      - 'file.name': 'regex_extract($event.original, ''Data Name="OriginalFileName">([^/]+)')'
      - 'process.entity_id': 'regex_extract($event.original, ''Data Name="ProcessGuid">([^/]+)')'
      - 'process.parent.entity_id': 'regex_extract($event.original, ''Data Name="ParentProcessGuid">([^/]+)')'
      - 'rule.name': 'regex_extract($event.original, ''Data Name="RuleName">([^/]+)')'
      - 'event.dataset': 'sysmon-linux'
      - 'event.kind': 'event'
      - 'event.category': 'array_append_unique(host)'
      - 'labels': '$_tmp.kv'
enabled: true
